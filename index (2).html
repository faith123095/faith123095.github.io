<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faith | Interactive Portfolio</title>
<meta name="description" content="Ask me about my projects, skills and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfbf8; --surface: #ffffff; --ink: #1c1c1a; --muted: #6b6b66;
    --line: #e4e4de; --accent: #1c1c1a; --accent-ink: #ffffff; --bubble: #f0f0ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1c1c1c; --ink: #f2f2ee; --muted: #a1a19a;
      --line: #2e2e2e; --accent: #f2f2ee; --accent-ink: #121212; --bubble: #262626; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; line-height: 1.55; display: flex; flex-direction: column; }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #4d7cff; outline-offset: 2px; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
  .top .name { font-weight: 800; font-size: 1.1rem; background: none; border: 0; cursor: pointer; padding: 0; }
  .top a { text-decoration: none; font-size: .9rem; font-weight: 600; border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 999px; }

  main { flex: 1; width: 100%; max-width: 680px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; min-height: 0; }

  /* hero */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 12px 0; }
  .avatar { width: 140px; height: 140px; border-radius: 50%; background: var(--bubble); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; font-size: 3.6rem; font-weight: 800; margin-bottom: 18px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero h2 { margin: 0; font-size: 1.2rem; font-weight: 500; color: var(--muted); }
  .hero h1 { margin: 6px 0 0; font-size: clamp(2.4rem, 9vw, 3.8rem); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }

  /* chat */
  .chat { flex: 1; overflow-y: auto; padding: 8px 0 16px; display: none; flex-direction: column; gap: 14px; }
  body.chatting .chat { display: flex; }
  body.chatting .hero { display: none; }
  .msg { max-width: 92%; padding: 12px 16px; border-radius: 18px; }
  .msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .msg ul { margin: 6px 0 0; padding-left: 20px; }
  .msg a { font-weight: 600; }
  .proj { display: block; text-decoration: none; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 14px; margin-top: 8px; }
  .proj b { display: block; }
  .proj span { color: var(--muted); font-size: .92rem; }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* bottom bar */
  .bar { padding: 8px 0 20px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: .95rem; }
  .pill:hover { border-color: var(--ink); }
  form { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 20px; }
  form:focus-within { border-color: var(--ink); }
  input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; }
  .send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; font-size: 1.1rem; font-weight: 800; }

  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .6; } }
</style>
</head>
<body>

<div class="top">
  <button class="name" id="home" type="button">Faith</button>
  <a href="https://github.com/faith123095">GitHub</a>
</div>

<main>
  <section class="hero" id="hero">
    <div class="avatar">
      <!-- Put your picture or memoji at images/faith.jpg -->
      <img src="images/faith.jpg" alt="Picture of Faith" onerror="this.remove()">
      <span>👋</span>
    </div>
    <h2>Hey, I’m Faith 👋</h2>
    <h1>Aspiring Software Developer, a system analyst</h1>
  </section>

  <section class="chat" id="chat" aria-live="polite"></section>

  <div class="bar">
    <div class="pills" id="pills">
      <button class="pill" data-q="me">🙋 Me</button>
      <button class="pill" data-q="projects">💼 Projects</button>
      <button class="pill" data-q="skills">🛠️ Skills</button>
      <button class="pill" data-q="fun">🎮 Fun</button>
      <button class="pill" data-q="contact">✉️ Contact</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Ask me anything about Faith…" aria-label="Ask a question">
      <button class="send" type="submit" aria-label="Send">↑</button>
    </form>
  </div>
</main>

<script>
  // ---- EDIT YOUR ANSWERS HERE ----
  var ANSWERS = {
    me: '<h3>About me</h3><p>I’m Faith, and I’m learning to design and build software and hadware. Right now I’m working on  Project  and using GitHub to keep every change organized.</p><p>[Add two sentences about your school, goals or what drives you.]</p>',
    projects: '<h3>My projects</h3>' +
      '<a class="proj" href="https://github.com/faith123095/Project-Nexus"><b>Project Nexus</b><span>[One line about what it does]. Built with GitHub as its backbone.</span></a>' +
      '<a class="proj" href="#"><b>[AURAGUARD AI]</b><span>[To monitor student stress,fatigue,and physiological indicators over time using non-contact computer vision abd thermal sensing]</span></a>' +
      '<a class="proj" href="#"><b>[Parking Slot Reservation Management System]</b><span>[ a software app;ication to make parking in schools more organize , efficient,and convinient]</span></a>',
    skills: '<h3>Skills</h3><ul><li>Git and GitHub (repositories, branches, commits, pull requests)</li><li>HTML and CSS</li><li>Software design</li><li>[Add your languages and tools]</li></ul>',
    fun: '<h3>Outside of code</h3><p>[Tell people what you enjoy: hobbies, games, music, shows, anything.]</p>',
    contact: '<h3>Let’s connect</h3><p>I’d love to hear from you.</p><ul><li>Email: <a href="mailto:you@example.com">you@example.com</a></li><li>GitHub: <a href="https://github.com/faith123095">faith123095</a></li><li>LinkedIn: <a href="#">[your link]</a></li></ul>'
  };
  var KEYWORDS = {
    me: ['me', 'who', 'about', 'yourself', 'name', 'hello', 'hi'],
    projects: ['project', 'work', 'build', 'app', 'nexus', 'portfolio'],
    skills: ['skill', 'tech', 'stack', 'language', 'tool', 'know', 'git'],
    fun: ['fun', 'hobby', 'hobbies', 'interest', 'free time', 'enjoy'],
    contact: ['contact', 'email', 'hire', 'reach', 'connect', 'linkedin']
  };
  var FALLBACK = '<p>I’m not sure about that one. Try one of the buttons below: Me, Projects, Skills, Fun or Contact.</p>';
  // --------------------------------

  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function add(cls, html, asText) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    if (asText) d.textContent = html; else d.innerHTML = html;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function findTopic(text) {
    var t = text.toLowerCase();
    for (var key in KEYWORDS) {
      for (var i = 0; i < KEYWORDS[key].length; i++) {
        if (t.indexOf(KEYWORDS[key][i]) !== -1) return key;
      }
    }
    return null;
  }

  function ask(label, topic) {
    document.body.classList.add('chatting');
    add('me', label, true);
    var typing = add('bot', '<span class="dots"><i></i><i></i><i></i></span>');
    setTimeout(function () {
      typing.innerHTML = topic ? ANSWERS[topic] : FALLBACK;
      chat.scrollTop = chat.scrollHeight;
    }, reduce ? 0 : 700);
  }

  document.getElementById('pills').addEventListener('click', function (e) {
    var b = e.target.closest('.pill');
    if (b) ask(b.textContent.replace(/^\S+\s/, ''), b.getAttribute('data-q'));
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v) return;
    input.value = '';
    ask(v, findTopic(v));
  });

  document.getElementById('home').addEventListener('click', function () {
    document.body.classList.remove('chatting');
    chat.innerHTML = '';
  });
</script>
</body>
</html>
